<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ちょいあく校長先生（ラスボス）バトル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Kaisei+Decol:wght@700&family=M+PLUS+Rounded+1c:wght@700;900&display=swap');

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #0d0f12;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-pixel {
            font-family: 'DotGothic16', sans-serif;
        }

        .font-boss {
            font-family: 'Kaisei Decol', serif;
        }

        /* ラスボスオーラアニメーション */
        @keyframes aura-pulse {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(138, 43, 226, 0.8)) drop-shadow(0 0 30px rgba(50, 205, 50, 0.4)); }
            50% { filter: drop-shadow(0 0 25px rgba(138, 43, 226, 1)) drop-shadow(0 0 45px rgba(0, 255, 127, 0.7)); }
        }

        .boss-aura {
            animation: aura-pulse 2s infinite ease-in-out;
        }

        /* ネオンボタン風スタイル */
        .btn-action {
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            border: 2px solid #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.8);
            transform: translateY(-2px);
        }

        .btn-action:active {
            transform: translateY(1px);
        }

        /* ダメージ画面フラッシュ */
        @keyframes damage-flash {
            0% { background-color: rgba(239, 68, 68, 0.3); }
            100% { background-color: transparent; }
        }

        .flash-damage {
            animation: damage-flash 0.2s ease-out;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between items-center relative overflow-hidden bg-slate-950 text-white">

    <!-- ゲーム画面上のHUD / ヘッダー -->
    <header class="w-full max-w-4xl p-4 flex flex-col gap-2 z-20 pointer-events-none">
        <!-- ラスボスHPバー -->
        <div class="bg-slate-900/80 border-2 border-purple-500 rounded-xl p-3 backdrop-blur-md shadow-lg shadow-purple-900/30">
            <div class="flex justify-between items-center mb-1">
                <div class="flex items-center gap-2">
                    <span class="bg-purple-900 text-purple-200 text-xs px-2 py-0.5 rounded border border-purple-400 font-bold">ラスボス</span>
                    <h1 id="boss-name" class="font-boss text-xl md:text-2xl font-black text-emerald-400 tracking-wider">ちょいあく校長（ゾンビ化）</h1>
                </div>
                <span id="boss-hp-text" class="font-pixel text-sm font-bold text-slate-300">HP: 1000 / 1000</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-4 overflow-hidden p-0.5 border border-slate-700">
                <div id="boss-hp-bar" class="bg-gradient-to-r from-emerald-500 via-purple-500 to-red-500 h-full rounded-full transition-all duration-100" style="width: 100%;"></div>
            </div>
            <!-- 現在の攻撃パターン名表示 -->
            <div class="mt-1 flex justify-between text-xs text-slate-400 font-pixel">
                <span>説教モード: <strong id="pattern-name" class="text-yellow-400">①【校則違反！】高速直進射撃</strong></span>
                <span id="boss-quote" class="text-purple-300 italic">「校則違反は即反省文だ！！」</span>
            </div>
        </div>

        <!-- プレイヤー情報 & スコア -->
        <div class="flex justify-between items-center text-sm px-2">
            <div class="flex items-center gap-4 bg-slate-900/70 px-4 py-1.5 rounded-lg border border-slate-800">
                <span class="text-blue-400 font-bold flex items-center gap-1"><i class="fa-solid fa-graduation-cap"></i> 生徒HP:</span>
                <div id="player-hp-icons" class="flex gap-1 text-red-500 text-base">
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>
            <div class="bg-slate-900/70 px-4 py-1.5 rounded-lg border border-slate-800 text-amber-400 font-pixel">
                SCORE: <span id="score-val" class="text-white text-base">0</span>
            </div>
        </div>
    </header>

    <!-- メインCanvasエリア -->
    <main class="relative w-full max-w-4xl flex-1 flex items-center justify-center p-2">
        <canvas id="gameCanvas" class="w-full h-full rounded-2xl border-2 border-slate-800 bg-slate-900/90 shadow-2xl touch-none"></canvas>
        
        <!-- スタート/オーバーレイ画面 -->
        <div id="overlay-screen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-6 text-center z-30">
            <div class="mb-4 relative">
                <!-- プレビュー用の校長アイコン -->
                <div class="w-32 h-32 mx-auto mb-2 rounded-full bg-slate-800 border-4 border-emerald-500/50 flex items-center justify-center shadow-lg shadow-emerald-900/50 overflow-hidden">
                    <svg viewBox="0 0 200 200" class="w-28 h-28">
                        <path d="M50 160 Q100 140 150 160 L160 200 L40 200 Z" fill="#1e293b" />
                        <path d="M85 145 L100 170 L115 145 Z" fill="#ffffff" />
                        <path d="M96 148 L104 148 L102 180 L98 180 Z" fill="#dc2626" />
                        <ellipse cx="100" cy="100" rx="45" ry="50" fill="#4ade80" />
                        <rect x="70" y="85" width="25" height="15" rx="3" fill="none" stroke="#000" stroke-width="4" />
                        <rect x="105" y="85" width="25" height="15" rx="3" fill="none" stroke="#000" stroke-width="4" />
                        <line x1="95" y1="92" x2="105" y2="92" stroke="#000" stroke-width="4" />
                        <path d="M60 80 Q100 60 140 80 Q100 40 60 80 Z" fill="#94a3b8" />
                    </svg>
                </div>
                <h2 id="overlay-title" class="text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-purple-400 to-red-500 font-boss mb-2">
                    ラスボス！ちょいあく校長先生
                </h2>
                <p id="overlay-desc" class="text-slate-300 text-sm max-w-md mx-auto mb-6">
                    「廊下を走るな！」「校則を守れ！」<br>
                    ゾンビ化して覚醒した校長先生の強烈なお説教（全5パターンの言葉の弾丸）を回避し、反論弾で撃破せよ！
                </p>
            </div>

            <button id="start-btn" class="px-8 py-4 rounded-xl font-black text-lg bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-700/50 border-2 border-emerald-300 hover:scale-105 transition-all cursor-pointer">
                <i class="fa-solid fa-play mr-2"></i> 説教バトル開始！
            </button>

            <!-- 操作説明 -->
            <div class="mt-8 text-xs text-slate-400 bg-slate-900/80 p-3 rounded-lg border border-slate-800 max-w-sm">
                <p class="font-bold text-slate-300 mb-1">【操作方法】</p>
                <p>PC: <span class="text-yellow-400">矢印キー / WASD</span> で移動 | <span class="text-yellow-400">Space</span> で反論ショット</p>
                <p>スマホ: 画面ドラッグで移動（自動攻撃）</p>
            </div>
        </div>
    </main>

    <!-- 下部コントローラー & パターン手動トリガー（検証・観賞用） -->
    <footer class="w-full max-w-4xl p-3 z-20 flex flex-col gap-2">
        <div class="text-center text-xs text-slate-400 mb-1 flex justify-between items-center px-2">
            <span><i class="fa-solid fa-wand-magic-sparkles text-purple-400"></i> 校長先生の5大説教攻撃パターン</span>
            <span class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-400">ボタンでテスト発射可能</span>
        </div>
        <div class="grid grid-cols-5 gap-1.5 md:gap-2">
            <button data-pattern="1" class="pattern-btn btn-action p-2 rounded-lg text-center text-xs border-cyan-500/50 hover:border-cyan-400">
                <div class="font-bold text-cyan-300 text-[11px] md:text-xs">① 校則違反！</div>
                <div class="text-[9px] text-slate-400 hidden md:block">高速ストレート</div>
            </button>
            <button data-pattern="2" class="pattern-btn btn-action p-2 rounded-lg text-center text-xs border-emerald-500/50 hover:border-emerald-400">
                <div class="font-bold text-emerald-300 text-[11px] md:text-xs">② 静かに！</div>
                <div class="text-[9px] text-slate-400 hidden md:block">扇状拡散弾幕</div>
            </button>
            <button data-pattern="3" class="pattern-btn btn-action p-2 rounded-lg text-center text-xs border-yellow-500/50 hover:border-yellow-400">
                <div class="font-bold text-yellow-300 text-[11px] md:text-xs">③ 私の若い頃</div>
                <div class="text-[9px] text-slate-400 hidden md:block">波状ウェーブ</div>
            </button>
            <button data-pattern="4" class="pattern-btn btn-action p-2 rounded-lg text-center text-xs border-pink-500/50 hover:border-pink-400">
                <div class="font-bold text-pink-300 text-[11px] md:text-xs">④ 追試決定！</div>
                <div class="text-[9px] text-slate-400 hidden md:block">ホーミング追尾</div>
            </button>
            <button data-pattern="5" class="pattern-btn btn-action p-2 rounded-lg text-center text-xs border-purple-500/50 hover:border-purple-400">
                <div class="font-bold text-purple-300 text-[11px] md:text-xs">⑤ 校歌斉唱</div>
                <div class="text-[9px] text-slate-400 hidden md:block">全方位スパイラル</div>
            </button>
        </div>
    </footer>

    <script>
        // --- Canvas & Core System Initialization ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let frameCount = 0;
        let gameActive = false;
        let score = 0;

        // キャラクター & オブジェクト定義
        const boss = {
            x: 0,
            y: 120,
            targetX: 0,
            targetY: 120,
            hp: 1000,
            maxHp: 1000,
            currentPattern: 1,
            patternTimer: 0,
            mouthOpen: 0,
            scale: 0.9
        };

        const player = {
            x: 0,
            y: 0,
            radius: 16,
            speed: 5,
            hp: 5,
            maxHp: 5,
            isShooting: false,
            lastShot: 0
        };

        let playerBullets = [];
        let bossBullets = [];
        let particles = [];
        let floatTexts = [];

        // --- Sound System (Tone.js) ---
        let audioInit = false;
        let synth, polySynth;

        function initAudio() {
            if (audioInit) return;
            try {
                Tone.start();
                synth = new Tone.Synth().toDestination();
                polySynth = new Tone.PolySynth(Tone.Synth).toDestination();
                polySynth.set({ volume: -12 });
                audioInit = true;
            } catch (e) {
                console.log("Audio init error:", e);
            }
        }

        function playSound(type) {
            if (!audioInit) return;
            const now = Tone.now();
            try {
                if (type === 'shoot') {
                    synth.triggerAttackRelease('C5', '16n', now, 0.1);
                } else if (type === 'boss_attack') {
                    synth.triggerAttackRelease('G3', '8n', now, 0.15);
                } else if (type === 'boss_ultimate') {
                    polySynth.triggerAttackRelease(['C3', 'E3', 'G3'], '8n', now, 0.2);
                } else if (type === 'hit') {
                    synth.triggerAttackRelease('E4', '16n', now, 0.1);
                } else if (type === 'player_damage') {
                    synth.triggerAttackRelease('A2', '8n', now, 0.2);
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        // 校長先生のお説教言葉辞書
        const bossWords = {
            p1: ['校則違反！', '遅刻だ！', 'スマホ没収！', '廊下を走るな！', '反省文！'],
            p2: ['話を聞け！', '静かにしなさい！', '何分かかった！？', '黙りなさい！'],
            p3: ['私の若い頃は…', '根性が足りん！', '気合を入れろ！', '甘えるな！'],
            p4: ['追試決定！', '赤点だ！', '補習に来い！', '落第！'],
            p5: ['校〜歌〜斉〜唱〜！', '起立！', '気をつけ！', '礼！']
        };

        // --- キーボード & タッチ入力処理 ---
        const keys = {};

        window.addEventListener('keydown', (e) => {
            initAudio();
            keys[e.key] = true;
            if (e.key === ' ' || e.code === 'Space') {
                player.isShooting = true;
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
            if (e.key === ' ' || e.code === 'Space') {
                player.isShooting = false;
            }
        });

        // タッチ操作（画面移動 & 自動ショット）
        let isTouching = false;
        canvas.addEventListener('touchstart', (e) => {
            initAudio();
            isTouching = true;
            updateTouchPos(e);
            player.isShooting = true;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isTouching) updateTouchPos(e);
        });

        canvas.addEventListener('touchend', () => {
            isTouching = false;
            player.isShooting = false;
        });

        function updateTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            player.x = touch.clientX - rect.left;
            player.y = touch.clientY - rect.top;
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            if (player) {
                player.x = Math.min(Math.max(player.radius, player.x), canvas.width - player.radius);
                player.y = Math.min(Math.max(player.radius, player.y), canvas.height - player.radius);
            }
            if (boss) {
                boss.x = canvas.width / 2;
            }
        }

        /**
         * 【移植・汎用利用対応】ちょいあく校長先生 全身ベクター描画モジュール
         * 
         * @param {CanvasRenderingContext2D} ctx - 描画コンテキスト
         * @param {Object} b - 校長先生の状態オブジェクト (x, y, scale, mouthOpen, expression, pattern, etc.)
         */
        function drawBoss(ctx, b) {
            ctx.save();
            ctx.translate(b.x, b.y);

            // スケール適用 (他のゲームでのサイズ変更に便利)
            const scale = b.scale || 0.9;
            ctx.scale(scale, scale);

            // アニメーション用変数（浮遊・身体のくねり・ポーズ）
            const floatY = Math.sin(frameCount * 0.05) * 10;
            const bodyTilt = Math.sin(frameCount * 0.03) * 0.05; // 身体のゆらぎ
            const legWalk = Math.sin(frameCount * 0.1) * 5; // 足の微かなステップ

            // 1. 悪の禍々しいオーラ（背景発光）
            const gradient = ctx.createRadialGradient(0, 0, 30, 0, 0, 140);
            gradient.addColorStop(0, 'rgba(168, 85, 247, 0.45)');
            gradient.addColorStop(0.5, 'rgba(16, 185, 129, 0.25)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, floatY, 140 + Math.sin(frameCount * 0.1) * 12, 0, Math.PI * 2);
            ctx.fill();

            // 2. 足元：影または朝礼台 (Podium)
            ctx.save();
            ctx.translate(0, 120);
            // 足元の影
            ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
            ctx.beginPath();
            ctx.ellipse(0, 5, 60, 15, 0, 0, Math.PI * 2);
            ctx.fill();

            // 朝礼台（校長先生らしさUPのオブジェ）
            ctx.fillStyle = '#334155'; // 木地・スチール調の朝礼台
            ctx.beginPath();
            ctx.roundRect(-45, -5, 90, 20, 4);
            ctx.fill();
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 朝礼台の「校章」マーク
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(0, 5, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // --- ここから校長先生本体（浮遊＆ゆらぎアニメ） ---
            ctx.translate(0, floatY);
            ctx.rotate(bodyTilt);

            // 3. 【脚＆靴】 (全身要素 1)
            // 左脚＆右脚 (スーツスラックス：ダークネイビー)
            ctx.fillStyle = '#1e1b4b';
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2;

            // 左足
            ctx.beginPath();
            ctx.roundRect(-24, 60, 20, 55 + legWalk, 4);
            ctx.fill();
            ctx.stroke();

            // 右足
            ctx.beginPath();
            ctx.roundRect(4, 60, 20, 55 - legWalk, 4);
            ctx.fill();
            ctx.stroke();

            // 革靴（ぴかぴかに磨かれた黒の革靴）
            ctx.fillStyle = '#090d16'; // 漆黒
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1.5;

            // 左靴
            ctx.beginPath();
            ctx.roundRect(-30, 108 + legWalk, 24, 15, [6, 2, 4, 8]);
            ctx.fill();
            ctx.stroke();

            // 右靴
            ctx.beginPath();
            ctx.roundRect(6, 108 - legWalk, 24, 15, [2, 6, 8, 4]);
            ctx.fill();
            ctx.stroke();

            // 靴のハイライト (ツヤ)
            ctx.fillStyle = '#94a3b8';
            ctx.beginPath();
            ctx.ellipse(-20, 112 + legWalk, 5, 2, -0.2, 0, Math.PI * 2);
            ctx.ellipse(16, 112 - legWalk, 5, 2, 0.2, 0, Math.PI * 2);
            ctx.fill();

            // 4. 【胴体＆スーツジャケット】 (全身要素 2)
            // スーツジャケット
            ctx.fillStyle = '#1e1b4b'; // ダークネイビー
            ctx.beginPath();
            ctx.moveTo(-50, -5);
            ctx.quadraticCurveTo(0, -15, 50, -5);
            ctx.lineTo(55, 65);
            ctx.lineTo(-55, 65);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2;
            ctx.stroke();

            // シャツ（白）
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.moveTo(-18, -10);
            ctx.lineTo(18, -10);
            ctx.lineTo(10, 55);
            ctx.lineTo(-10, 55);
            ctx.closePath();
            ctx.fill();

            // ネクタイ（情熱の赤）
            ctx.fillStyle = '#dc2626';
            ctx.beginPath();
            ctx.moveTo(-7, -8);
            ctx.lineTo(7, -8);
            ctx.lineTo(10, 48);
            ctx.lineTo(0, 60);
            ctx.lineTo(-10, 48);
            ctx.closePath();
            ctx.fill();

            // スーツの衿（ラペル）
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.moveTo(-45, -5); ctx.lineTo(-16, -10); ctx.lineTo(-8, 40); ctx.lineTo(-32, 30);
            ctx.closePath(); ctx.fill();

            ctx.beginPath();
            ctx.moveTo(45, -5); ctx.lineTo(16, -10); ctx.lineTo(8, 40); ctx.lineTo(32, 30);
            ctx.closePath(); ctx.fill();

            // ゴールドの校章バッジ（胸元）
            ctx.fillStyle = '#fbbf24';
            ctx.strokeStyle = '#b45309';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(-26, 10, 5, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            // 5. 【腕＆手】 (全身要素 3)
            // 左腕（威厳ある腰当てポーズ）
            ctx.fillStyle = '#1e1b4b';
            ctx.beginPath();
            ctx.moveTo(-48, 0);
            ctx.quadraticCurveTo(-70, 25, -50, 50);
            ctx.lineTo(-40, 45);
            ctx.quadraticCurveTo(-55, 25, -42, 5);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // 左手（ゾンビグリーンの手）
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.arc(-50, 50, 8, 0, Math.PI * 2);
            ctx.fill();

            // 右腕（指示棒を誇らしげに掲げる手）
            const armAngle = Math.sin(frameCount * 0.08) * 0.15;
            ctx.save();
            ctx.translate(45, 0);
            ctx.rotate(armAngle);

            ctx.fillStyle = '#1e1b4b';
            ctx.beginPath();
            ctx.roundRect(-6, 0, 16, 45, 6);
            ctx.fill(); ctx.stroke();

            // 右手
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.arc(2, 48, 8, 0, Math.PI * 2);
            ctx.fill();

            // 校長先生の武器：伸縮式「指示棒」
            ctx.save();
            ctx.translate(2, 48);
            ctx.rotate(-0.5);
            // 柄
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-3, -10, 6, 20);
            // メタル先端
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(-2, -70, 4, 60);
            // 赤いポインター玉
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(0, -73, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.restore(); // 右腕終了

            // 6. 【頭部＆首】 (全身要素 4)
            // 首（ゾンビグリーン影）
            ctx.fillStyle = '#15803d';
            ctx.fillRect(-12, -28, 24, 20);

            // 頭部グラデーション（ゾンビ顔）
            const headGrad = ctx.createLinearGradient(0, -100, 0, -20);
            headGrad.addColorStop(0, '#86efac'); // ゾンビグリーン明るめ
            headGrad.addColorStop(0.6, '#22c55e'); 
            headGrad.addColorStop(1, '#166534'); // 影
            ctx.fillStyle = headGrad;

            ctx.beginPath();
            ctx.ellipse(0, -55, 42, 48, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#14532d';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 7. 【髪型】（校長特有の七三分けバーコード白髪）
            ctx.fillStyle = '#e2e8f0';
            // サイドのふんわり白髪
            ctx.beginPath();
            ctx.ellipse(-42, -60, 10, 20, 0.2, 0, Math.PI * 2);
            ctx.ellipse(42, -60, 10, 20, -0.2, 0, Math.PI * 2);
            ctx.fill();

            // トップのバーコードヘア（繊細な髪線）
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(-25, -96); ctx.quadraticCurveTo(0, -102, 20, -98);
            ctx.moveTo(-20, -92); ctx.quadraticCurveTo(0, -98, 25, -94);
            ctx.moveTo(-15, -88); ctx.quadraticCurveTo(5, -94, 22, -90);
            ctx.stroke();

            // 8. 【顔のパーツ】（眉・目・メガネ・口・金歯）
            // 吊り上がった強面眉毛
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 4.5;
            ctx.beginPath();
            ctx.moveTo(-32, -72); ctx.lineTo(-8, -62);
            ctx.moveTo(32, -72); ctx.lineTo(8, -62);
            ctx.stroke();

            // 白目
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(-18, -60, 10, 7, 0, 0, Math.PI * 2);
            ctx.ellipse(18, -60, 10, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // ゾンビ赤眼
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(-16 + Math.sin(frameCount * 0.1) * 2, -60, 4, 0, Math.PI * 2);
            ctx.arc(16 + Math.sin(frameCount * 0.1) * 2, -60, 4, 0, Math.PI * 2);
            ctx.fill();

            // 狂気の眼光フラッシュ
            if (Math.random() < 0.35 || b.currentPattern === 5) {
                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.arc(-16, -60, 7, 0, Math.PI * 2);
                ctx.arc(16, -60, 7, 0, Math.PI * 2);
                ctx.fill();
            }

            // メガネ（金縁スクエアフレーム）
            ctx.strokeStyle = '#eab308';
            ctx.lineWidth = 3;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';

            // 左レンズ
            ctx.beginPath();
            ctx.roundRect(-30, -68, 22, 16, 3);
            ctx.fill(); ctx.stroke();

            // 右レンズ
            ctx.beginPath();
            ctx.roundRect(8, -68, 22, 16, 3);
            ctx.fill(); ctx.stroke();

            // ブリッジ＆つる
            ctx.beginPath();
            ctx.moveTo(-8, -60); ctx.lineTo(8, -60);
            ctx.moveTo(-30, -62); ctx.lineTo(-42, -65);
            ctx.moveTo(30, -62); ctx.lineTo(42, -65);
            ctx.stroke();

            // 口（説教パクパクアニメーション）
            ctx.fillStyle = '#450a0a';
            const openAmount = Math.abs(Math.sin(frameCount * 0.2)) * b.mouthOpen * 14;
            ctx.beginPath();
            ctx.ellipse(0, -38, 14, 6 + openAmount, 0, 0, Math.PI);
            ctx.fill();
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 悪のシンボル「金歯」
            ctx.fillStyle = '#facc15';
            ctx.fillRect(-6, -44, 4, 4);

            // ほうれい線＆しわ（厳格な貫禄表現）
            ctx.strokeStyle = '#14532d';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-22, -50); ctx.quadraticCurveTo(-26, -38, -18, -30);
            ctx.moveTo(22, -50); ctx.quadraticCurveTo(26, -38, 18, -30);
            ctx.stroke();

            ctx.restore();
        }

        function drawPlayer(ctx, p) {
            ctx.save();
            ctx.translate(p.x, p.y);

            // 自機オーラ
            ctx.fillStyle = 'rgba(59, 130, 246, 0.3)';
            ctx.beginPath();
            ctx.arc(0, 0, p.radius + 6 + Math.sin(frameCount * 0.2) * 2, 0, Math.PI * 2);
            ctx.fill();

            // 生徒アイコン（制服風丸アイコン）
            ctx.fillStyle = '#3b82f6'; // 学ラン/ブレザー青
            ctx.beginPath();
            ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 学生帽 or 頭部デザイン
            ctx.fillStyle = '#1e3a8a';
            ctx.beginPath();
            ctx.arc(0, -3, 9, 0, Math.PI * 2);
            ctx.fill();

            // 当たり判定用中央コア
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        /**
         * ちょいあく校長先生の5大攻撃パターン弾幕生成
         */
        function executeBossAttack() {
            if (!gameActive) return;
            boss.patternTimer++;

            const p = boss.currentPattern;

            // パターン1: 【校則違反！】超高速ストレートマシンガン
            if (p === 1) {
                if (boss.patternTimer % 8 === 0) {
                    const text = bossWords.p1[Math.floor(Math.random() * bossWords.p1.length)];
                    const angle = Math.atan2(player.y - boss.y, player.x - boss.x) + (Math.random() - 0.5) * 0.2;
                    bossBullets.push({
                        x: boss.x,
                        y: boss.y + 20,
                        vx: Math.cos(angle) * 7,
                        vy: Math.sin(angle) * 7,
                        text: text,
                        color: '#06b6d4', // シアン
                        size: 14,
                        radius: 12,
                        type: 'straight'
                    });
                    boss.mouthOpen = 1;
                    playSound('boss_attack');
                }
            }

            // パターン2: 【話を聞け！】3WAY〜7WAY 扇状拡散言葉弾
            else if (p === 2) {
                if (boss.patternTimer % 35 === 0) {
                    const text = bossWords.p2[Math.floor(Math.random() * bossWords.p2.length)];
                    const count = 7;
                    const baseAngle = Math.atan2(player.y - boss.y, player.x - boss.x);
                    const spread = Math.PI / 3; // 60度拡散

                    for (let i = 0; i < count; i++) {
                        const angle = baseAngle - (spread / 2) + (spread / (count - 1)) * i;
                        bossBullets.push({
                            x: boss.x,
                            y: boss.y + 20,
                            vx: Math.cos(angle) * 4.5,
                            vy: Math.sin(angle) * 4.5,
                            text: text,
                            color: '#10b981', // エメラルド
                            size: 15,
                            radius: 14,
                            type: 'spread'
                        });
                    }
                    boss.mouthOpen = 1;
                    playSound('boss_attack');
                }
            }

            // パターン3: 【私の若い頃は…】波状（サインウェーブ）左右拡散言葉弾
            else if (p === 3) {
                if (boss.patternTimer % 12 === 0) {
                    const text = bossWords.p3[Math.floor(Math.random() * bossWords.p3.length)];
                    const angle = Math.PI / 2 + (Math.random() - 0.5) * 0.8;
                    bossBullets.push({
                        x: boss.x + (Math.random() - 0.5) * 60,
                        y: boss.y + 30,
                        vx: Math.cos(angle) * 3.5,
                        vy: Math.sin(angle) * 3.5,
                        baseVx: Math.cos(angle) * 3.5,
                        text: text,
                        color: '#eab308', // イエロー
                        size: 16,
                        radius: 15,
                        waveFreq: 0.1,
                        waveAmp: 4,
                        time: 0,
                        type: 'wave'
                    });
                    boss.mouthOpen = 1;
                    playSound('boss_attack');
                }
            }

            // パターン4: 【追試決定！】プレイヤーをじわじわ追いかける誘導ホミング弾
            else if (p === 4) {
                if (boss.patternTimer % 45 === 0) {
                    const text = bossWords.p4[Math.floor(Math.random() * bossWords.p4.length)];
                    bossBullets.push({
                        x: boss.x + (Math.random() - 0.5) * 80,
                        y: boss.y + 20,
                        vx: 0,
                        vy: 2,
                        text: text,
                        color: '#ec4899', // ピンク
                        size: 18,
                        radius: 16,
                        life: 240, // 4秒間追尾
                        type: 'homing'
                    });
                    boss.mouthOpen = 1;
                    playSound('boss_attack');
                }
            }

            // パターン5: 【ラスボス奥義：校歌斉唱】全方位360度渦巻きスパイラル弾幕
            else if (p === 5) {
                if (boss.patternTimer % 4 === 0) {
                    const text = bossWords.p5[Math.floor(Math.random() * bossWords.p5.length)];
                    const spiralAngle = boss.patternTimer * 0.25;
                    bossBullets.push({
                        x: boss.x,
                        y: boss.y,
                        vx: Math.cos(spiralAngle) * 4,
                        vy: Math.sin(spiralAngle) * 4,
                        text: text,
                        color: '#a855f7', // パープル
                        size: 15,
                        radius: 13,
                        type: 'spiral'
                    });
                    
                    // 逆回転弾も同時発射
                    bossBullets.push({
                        x: boss.x,
                        y: boss.y,
                        vx: Math.cos(-spiralAngle) * 4,
                        vy: Math.sin(-spiralAngle) * 4,
                        text: text,
                        color: '#f43f5e', // ローズ
                        size: 15,
                        radius: 13,
                        type: 'spiral'
                    });

                    boss.mouthOpen = 1;
                    if (boss.patternTimer % 12 === 0) playSound('boss_ultimate');
                }
            }

            // パターン切り替えタイマー (自動周期: 約7秒ごとに切り替え)
            if (boss.patternTimer > 420) {
                switchPattern((boss.currentPattern % 5) + 1);
            }
        }

        function switchPattern(patternNum) {
            boss.currentPattern = parseInt(patternNum);
            boss.patternTimer = 0;
            const names = [
                '①【校則違反！】高速直進射撃',
                '②【静かに！】扇状拡散説教',
                '③【私の若い頃は】怒涛の波状攻撃',
                '④【追試決定！】追尾赤点ホミング',
                '⑤【校歌斉唱】全方位スパイラル奥義'
            ];
            const quotes = [
                '「校則違反は即反省文だ！！」',
                '「静かになるまで３分かかりました！」',
                '「今の若い者は根性が足りん！」',
                '「赤点者は放課後補習決定！！」',
                '「校〜歌〜斉〜唱〜！！起立！！」'
            ];
            document.getElementById('pattern-name').innerText = names[boss.currentPattern - 1];
            document.getElementById('boss-quote').innerText = quotes[boss.currentPattern - 1];

            // 浮遊テキスト演出
            addFloatText(boss.x, boss.y - 60, quotes[boss.currentPattern - 1], '#c084fc');
        }

        // 手動パターン切り替えボタンイベント設定
        document.querySelectorAll('.pattern-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const pat = e.currentTarget.getAttribute('data-pattern');
                switchPattern(pat);
                initAudio();
            });
        });

        function update() {
            if (!gameActive) return;

            frameCount++;

            // 口パク減少
            if (boss.mouthOpen > 0) boss.mouthOpen -= 0.05;

            // 1. プレイヤーの移動制御
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;

            // 画面外制限
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius + 100, Math.min(canvas.height - player.radius, player.y));

            // 2. プレイヤーの反論ショット
            if (player.isShooting && frameCount - player.lastShot > 8) {
                playerBullets.push({
                    x: player.x,
                    y: player.y - 15,
                    vx: 0,
                    vy: -10,
                    text: '異議あり！',
                    radius: 8
                });
                player.lastShot = frameCount;
                playSound('shoot');
            }

            // 校長の移動（プレイヤーに合わせてふわふわ追従）
            boss.targetX = canvas.width / 2 + Math.sin(frameCount * 0.02) * (canvas.width * 0.3);
            boss.targetY = 120 + Math.cos(frameCount * 0.03) * 20;
            boss.x += (boss.targetX - boss.x) * 0.05;
            boss.y += (boss.targetY - boss.y) * 0.05;

            // ボス攻撃ルーチン
            executeBossAttack();

            // 3. プレイヤー弾の更新＆当たり判定
            for (let i = playerBullets.length - 1; i >= 0; i--) {
                const pb = playerBullets[i];
                pb.y += pb.vy;

                // 校長へのヒット判定
                const distToBoss = Math.hypot(pb.x - boss.x, pb.y - boss.y);
                if (distToBoss < 60) {
                    boss.hp -= 8;
                    score += 50;
                    playSound('hit');

                    // ヒットスパーク生成
                    createExplosion(pb.x, pb.y, '#38bdf8', 5);

                    playerBullets.splice(i, 1);

                    // UI更新
                    updateHUD();

                    if (boss.hp <= 0) {
                        gameWin();
                        break;
                    }
                    continue;
                }

                if (pb.y < -20) playerBullets.splice(i, 1);
            }

            // 4. 校長説教弾の更新＆当たり判定
            for (let i = bossBullets.length - 1; i >= 0; i--) {
                const bb = bossBullets[i];

                // 弾タイプ別の運動
                if (bb.type === 'wave') {
                    bb.time++;
                    bb.x += bb.baseVx + Math.sin(bb.time * bb.waveFreq) * bb.waveAmp;
                    bb.y += bb.vy;
                } else if (bb.type === 'homing' && bb.life > 0) {
                    bb.life--;
                    const angle = Math.atan2(player.y - bb.y, player.x - bb.x);
                    bb.vx += Math.cos(angle) * 0.15;
                    bb.vy += Math.sin(angle) * 0.15;
                    // 最高速度制限
                    const speed = Math.hypot(bb.vx, bb.vy);
                    if (speed > 4.5) {
                        bb.vx = (bb.vx / speed) * 4.5;
                        bb.vy = (bb.vy / speed) * 4.5;
                    }
                    bb.x += bb.vx;
                    bb.y += bb.vy;
                } else {
                    bb.x += bb.vx;
                    bb.y += bb.vy;
                }

                // 生徒（プレイヤー）へのヒット判定
                const distToPlayer = Math.hypot(bb.x - player.x, bb.y - player.y);
                if (distToPlayer < player.radius + bb.radius - 4) {
                    player.hp--;
                    playSound('player_damage');
                    createExplosion(player.x, player.y, '#ef4444', 12);
                    
                    // 画面フラッシュ効果
                    document.body.classList.add('flash-damage');
                    setTimeout(() => document.body.classList.remove('flash-damage'), 200);

                    bossBullets.splice(i, 1);
                    updateHUD();

                    if (player.hp <= 0) {
                        gameOver();
                        break;
                    }
                    continue;
                }

                // 画面外消滅
                if (bb.x < -50 || bb.x > canvas.width + 50 || bb.y < -50 || bb.y > canvas.height + 50) {
                    bossBullets.splice(i, 1);
                }
            }

            // 5. パーティクルの更新
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= 0.02;
                if (pt.alpha <= 0) particles.splice(i, 1);
            }

            // 6. 浮遊テキストの更新
            for (let i = floatTexts.length - 1; i >= 0; i--) {
                const ft = floatTexts[i];
                ft.y -= 1;
                ft.alpha -= 0.015;
                if (ft.alpha <= 0) floatTexts.splice(i, 1);
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景グリッド風描画（ラスボスステージ）
            ctx.strokeStyle = 'rgba(51, 65, 85, 0.3)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            const offsetY = (frameCount * 1.5) % gridSize;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = offsetY; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            if (gameActive || boss.hp > 0) {
                // ちょいあく校長先生描画
                drawBoss(ctx, boss);

                // プレイヤー描画
                if (gameActive) drawPlayer(ctx, player);
            }

            // プレイヤーの反論弾描画
            for (const pb of playerBullets) {
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(pb.text, pb.x, pb.y);
                ctx.beginPath();
                ctx.arc(pb.x, pb.y - 4, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // 校長の説教言葉弾（テキストベクター描画）
            for (const bb of bossBullets) {
                ctx.save();
                ctx.translate(bb.x, bb.y);

                // 発光背景
                ctx.fillStyle = bb.color;
                ctx.shadowColor = bb.color;
                ctx.shadowBlur = 10;

                // テキストとカプセル背景
                ctx.font = `black ${bb.size}px 'M PLUS Rounded 1c', sans-serif`;
                const textWidth = ctx.measureText(bb.text).width;

                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.strokeStyle = bb.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(-textWidth / 2 - 8, -bb.size / 2 - 4, textWidth + 16, bb.size + 8, 12);
                ctx.fill();
                ctx.stroke();

                // 言葉テキスト
                ctx.fillStyle = bb.color;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(bb.text, 0, 1);

                ctx.restore();
            }

            // パーティクル描画
            for (const pt of particles) {
                ctx.save();
                ctx.globalAlpha = pt.alpha;
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // 浮遊テキスト描画
            for (const ft of floatTexts) {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.fillStyle = ft.color;
                ctx.font = "bold 16px 'Kaisei Decol', serif";
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }
        }

        // スパーク粒子生成
        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 4;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: color,
                    size: 2 + Math.random() * 3,
                    alpha: 1
                });
            }
        }

        function addFloatText(x, y, text, color) {
            floatTexts.push({ x, y, text, color, alpha: 1 });
        }

        // HUD更新
        function updateHUD() {
            // ボスHPバー
            const hpPercent = Math.max(0, (boss.hp / boss.maxHp) * 100);
            document.getElementById('boss-hp-bar').style.width = `${hpPercent}%`;
            document.getElementById('boss-hp-text').innerText = `HP: ${Math.max(0, boss.hp)} / ${boss.maxHp}`;
            document.getElementById('score-val').innerText = score;

            // プレイヤーライフ（ハートアイコン）
            const heartsContainer = document.getElementById('player-hp-icons');
            heartsContainer.innerHTML = '';
            for (let i = 0; i < player.maxHp; i++) {
                const heart = document.createElement('i');
                heart.className = i < player.hp ? 'fa-solid fa-heart' : 'fa-regular fa-heart text-slate-600';
                heartsContainer.appendChild(heart);
            }
        }

        function startGame() {
            initAudio();
            gameActive = true;
            score = 0;
            boss.hp = 1000;
            player.hp = 5;
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;

            bossBullets = [];
            playerBullets = [];
            particles = [];

            switchPattern(1);
            updateHUD();

            document.getElementById('overlay-screen').classList.add('hidden');
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('overlay-title').innerText = "説教に屈してしまった…";
            document.getElementById('overlay-title').className = "text-3xl md:text-4xl font-black text-red-500 font-boss mb-2";
            document.getElementById('overlay-desc').innerHTML = `校長「反省文原稿用紙100枚提出！！」<br>最終スコア: <span class="text-amber-400 font-bold">${score}</span>`;
            document.getElementById('start-btn').innerText = "もう一度挑む！";
            document.getElementById('overlay-screen').classList.remove('hidden');
        }

        function gameWin() {
            gameActive = false;
            document.getElementById('overlay-title').innerText = "説教完全撃破！クリア！";
            document.getElementById('overlay-title').className = "text-3xl md:text-4xl font-black text-emerald-400 font-boss mb-2";
            document.getElementById('overlay-desc').innerHTML = `校長「ぐぬぬ…論理的思考力、見事だ…！」<br>見事に校長先生の説教論破に成功した！<br>最終スコア: <span class="text-amber-400 font-bold">${score}</span>`;
            document.getElementById('start-btn').innerText = "再戦する！";
            document.getElementById('overlay-screen').classList.remove('hidden');
        }

        document.getElementById('start-btn').addEventListener('click', startGame);

        window.addEventListener('resize', resizeCanvas);

        function mainLoop() {
            update();
            render();
            requestAnimationFrame(mainLoop);
        }

        window.onload = () => {
            resizeCanvas();
            boss.x = canvas.width / 2;
            boss.y = 120;
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
            mainLoop();
        };
    </script>
</body>
</html>
